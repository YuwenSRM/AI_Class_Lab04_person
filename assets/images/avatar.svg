<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="邱超凡的头像">
  <defs>
    <linearGradient id="avatarBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="0.58" stop-color="#0071e3"/>
      <stop offset="1" stop-color="#30b0c7"/>
    </linearGradient>
    <radialGradient id="avatarGlow" cx="0.28" cy="0.2" r="0.92">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#avatarBg)"/>
  <circle cx="58" cy="48" r="96" fill="url(#avatarGlow)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.26">
    <circle cx="100" cy="100" r="72" stroke-width="1"/>
    <circle cx="100" cy="100" r="88" stroke-width="1" stroke-dasharray="2 8"/>
  </g>
  <text x="100" y="128" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="76" font-weight="600" fill="#ffffff">邱</text>
</svg>
